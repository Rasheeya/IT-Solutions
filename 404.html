<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Page Not Found - Stackly</title>
    <!-- Fonts -->
    <link rel="stylesheet" href="style.css">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        .error-page-container {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            position: relative;
            z-index: 10;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, var(--primary) 0%, var(--accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 16px;
            font-family: 'Outfit', sans-serif;
            text-shadow: 0 10px 30px rgba(79, 70, 229, 0.2);
        }
        .error-message {
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--text);
            margin-bottom: 12px;
        }
        .error-description {
            color: var(--text-light);
            margin-bottom: 32px;
            font-size: 0.95rem;
            line-height: 1.5;
        }
        .error-card {
            text-align: center;
            padding: 60px 40px;
            max-width: 500px;
        }
    </style>
</head>
<body>
    <!-- Background animations -->
    <div class="bg-decor">
        <div class="bg-bubble bg-bubble-1"></div>
        <div class="bg-bubble bg-bubble-2"></div>
        <div class="bg-bubble bg-bubble-3"></div>
    </div>

    <!-- Theme Switcher floating button -->
    <div style="position: fixed; top: 20px; right: 20px; z-index: 1000;">
        <button class="theme-toggle-btn" aria-label="Toggle Theme">
            <i class="fa-solid fa-moon"></i>
        </button>
    </div>

    <div class="error-page-container">
        <div class="auth-card error-card">
            <div class="brand-icon" style="margin: 0 auto 24px auto; width: 48px; height: 48px; font-size: 1.2rem;">
                <i class="fa-solid fa-briefcase"></i>
            </div>
            <div class="error-code">404</div>
            <h2 class="error-message">Page Not Found</h2>
            <p class="error-description">Oops! The page you are looking for doesn't exist or has been moved. Let's get you back to safety.</p>
            <a href="index.html" class="btn btn-primary" style="display: inline-flex; width: auto; padding: 12px 32px;">
                <i class="fa-solid fa-arrow-left" style="margin-right: 8px;"></i> Return to Login
            </a>
        </div>
    </div>

    <!-- Core Scripts -->
    <script src="script.js"></script>
</body>
</html>
